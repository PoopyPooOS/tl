[package]
name = "tl"
version = "0.1.0"
edition.workspace = true

[features]
default = ["serde", "fs"]
fs = []

serde = ["dep:serde"]

[dependencies]
tl-macro.path = "./tl-macro"

serde = { workspace = true, optional = true }
indexmap = { version = "2.0", features = ["serde"] }

miette.workspace = true
thiserror.workspace = true
derive_more = { version = "2.1.0", features = ["eq"] }

libloading = "0.9"

colored.workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
